name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies and browsers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            python scripts/setup.py --with-deps
          else
            python scripts/setup.py
          fi
      - name: Run checks for the branch format
        shell: bash
        env:
          CHECK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$CHECK_BRANCH" == "md" ]]; then
            python scripts/check.py
          else
            python scripts/check.py --format all
          fi
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-${{ matrix.os }}
          path: |
            .cache/check-results.json
            .cache/check/*.log
            .cache/format-check-results.json
            .cache/format-check-*/md/.cache/check/*.log
          if-no-files-found: ignore

  book-poster-windows:
    name: Book poster (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable renderer dependencies
        run: python scripts/setup.py --scope book-poster
      - name: Run actual Windows renderer tests
        run: python scripts/check.py --scope book-poster
      - name: Preserve Windows results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-windows-book-poster
          path: |
            .cache/check-results.json
            .cache/check/*.log
          if-no-files-found: ignore
